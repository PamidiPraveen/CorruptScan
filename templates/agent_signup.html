<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Sign Up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/agent_signup.css') }}">
</head>
<body>
    <div class="container">
        <h1>Agent Sign Up</h1>
        <form method="POST">
            <div class="input-group">
                <label for="full_name">Full Name</label>
                <input type="text" name="full_name" id="full_name" required>
            </div>
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" required>
            </div>
            <div class="input-group">
                <label for="department">Department</label>
                <input type="text" name="department" id="department" required>
            </div>
            <div class="input-group">
                <label for="employee_id">Employee ID</label>
                <input type="text" name="employee_id" id="employee_id" required>
            </div>
            <div class="input-group">
                <label for="designation">Designation</label>
                <input type="text" name="designation" id="designation" required>
            </div>
            <div class="input-group">
                <label for="department_address">Department Address</label>
                <input type="text" name="department_address" id="department_address" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" required>
            </div>
            <div class="input-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" name="confirm_password" id="confirm_password" required>
            </div>
            <button type="submit" class="button">Sign Up</button>
            <p><a href="{{ url_for('agent_signin') }}">Already have an account? Sign In</a></p>
        </form>
    </div>
</body>
</html>
