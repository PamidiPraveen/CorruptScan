<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Corruption</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/report_corruption.css') }}">
</head>
<body>
    <div class="container">
        <h1>Report Corruption</h1>
        <form method="POST" enctype="multipart/form-data">
            <!-- Department Selection -->
            <div class="input-group">
                <label for="department">Select Department</label>
                <select id="department" name="department" required onchange="updateDesignations()">
                    <option value="" disabled selected>Select a department</option>
                    {% for dept in departments %}
                        <option value="{{ dept }}">{{ dept }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Designation Selection -->
            <div class="input-group">
                <label for="designation">Select Designation</label>
                <select id="designation" name="designation" required onchange="updateEmployees()">
                    <option value="" disabled selected>Select a designation</option>
                </select>
            </div>

            <!-- Employee Name Selection -->
            <div class="input-group">
                <label for="employee_name">Select Employee</label>
                <select id="employee_name" name="employee_name" required>
                    <option value="" disabled selected>Select an employee</option>
                </select>
            </div>

            <!-- Complaint Description -->
            <div class="input-group">
                <label for="complaint_desc">Complaint Description</label>
                <textarea id="complaint_desc" name="complaint_desc" placeholder="Describe the corruption..." required></textarea>
            </div>

            <!-- Eyewitness Details -->
            <div class="input-group">
                <label for="eyewitness_name">Eyewitness Name</label>
                <input type="text" id="eyewitness_name" name="eyewitness_name" placeholder="Enter the eyewitness name" required>
            </div>

            <div class="input-group">
                <label for="eyewitness_address">Eyewitness Address</label>
                <input type="text" id="eyewitness_address" name="eyewitness_address" placeholder="Enter the eyewitness address" required>
            </div>

            <div class="input-group">
                <label for="eyewitness_age">Eyewitness Age</label>
                <input type="number" id="eyewitness_age" name="eyewitness_age" placeholder="Enter the eyewitness age" required>
            </div>

            <!-- Proof of Corruption -->
            <div class="input-group">
                <label for="proofs">Proof of Corruption (Image/Video/Other)</label>
                <input type="file" id="proofs" name="proofs" accept="image/*,video/*,.pdf,.docx" required>
            </div>

            <!-- Submit Button -->
            <div class="button-container">
                <button type="submit" class="submit-btn">Submit Report</button>
            </div>
        </form>
    </div>

    <script>
        // Sample data (replace with data fetched from MongoDB)
        const departmentData = {
            "Tax": {
                "Officer": ["John Doe", "Michael Lee", "Laura Wilson"],
                "Auditor": ["Mia Moore", "Lily Gray"],
                "Consultant": ["Harper Garcia", "Christopher Cooper"]
            },
            "Police": {
                "Inspector": ["Jane Smith", "Sarah Connor"],
                "Sergeant": ["James Carter", "Addison Richardson"],
                "Deputy": ["Noah Thomas", "Jack Bennett"]
            },
            // Add more departments and designations here
        };

        // Function to update designations based on selected department
        function updateDesignations() {
            const department = document.getElementById("department").value;
            const designationSelect = document.getElementById("designation");
            designationSelect.innerHTML = '<option value="" disabled selected>Select a designation</option>';

            if (department && departmentData[department]) {
                Object.keys(departmentData[department]).forEach(designation => {
                    const option = document.createElement("option");
                    option.value = designation;
                    option.textContent = designation;
                    designationSelect.appendChild(option);
                });
            }
        }

        // Function to update employees based on selected designation
        function updateEmployees() {
            const department = document.getElementById("department").value;
            const designation = document.getElementById("designation").value;
            const employeeSelect = document.getElementById("employee_name");
            employeeSelect.innerHTML = '<option value="" disabled selected>Select an employee</option>';

            if (department && designation && departmentData[department][designation]) {
                departmentData[department][designation].forEach(employee => {
                    const option = document.createElement("option");
                    option.value = employee;
                    option.textContent = employee;
                    employeeSelect.appendChild(option);
                });
            }
        }
    </script>
</body>
</html>
